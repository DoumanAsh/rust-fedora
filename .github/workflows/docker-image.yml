      - name: Log into ${{ env.QUAY_REGISTRY }} registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.QUAY_REGISTRY }}
          username: doumanash+rust-fedora-ci
          ## Set in repo Settings->Secrets->New repository secret
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Build Docker image
        id: build-docker
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          file: Dockerfile
          build-args: |
            INSTALLATION_TYPE=${{steps.determine_type.outputs.install_type}}
            FEDORA_VERSION=${{ matrix.fedora }}
          context: .
          platforms: linux/amd64
          load: true
          tags: |
