          exit-code: 0

      - name: Generate trivy.html fragment
        shell: bash
        env:
          TRIVY_JSON: trivy.json
        run: |
          echo '<h3>Summary</h3>' >> trivy.html
          jq -r '
            [.Results[]?.Vulnerabilities[]? | select(.Severity != null)] as $vulns
            | if ($vulns | length) == 0 then
                "<p>No vulnerabilities found ✅</p>"
