name: Docker

on:
  # Once a week
  schedule:
    - cron: '0 0 * * 0'
  push:
    paths:
      - '.github/workflows/docker-image.yml'
      - 'Dockerfile'
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - '**'
    paths:
      - '.github/workflows/docker-image.yml'
      - 'Dockerfile'

jobs:
  container:
    name: "${{ github.event.repository.name }}:${{matrix.build-type}}-fedora-${{ matrix.fedora }}"
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      packages: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        fedora: [42, 43, 44, 45]
        build-type: ["native", "rustup"]
    uses: DoumanAsh/douman-ci/.github/workflows/release-container.yaml@master
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
      QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
    with:
      # Make sure to create repos in all container registries using the same name as the repo
      image_name: ${{ github.event.repository.name }}
      annotations: |
        org.opencontainers.image.title=${{ github.event.repository.name }}
        org.opencontainers.image.description=${{ github.event.repository.description }}
        org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
        org.opencontainers.image.revision=${{ github.sha }}
      # Need dhi.io for hardened alpine image
      dhi_login: true
      container_file: "Dockerfile"
      use_oci: true
      platform: "linux"
      archs: "amd64 arm64"
      upload_container: ${{ github.event_name != 'pull_request' }}
      docker_user: "douman"
      github_user: "doumanash"
      quay_user: "doumanash"
      quay_bot_suffix: "rust-fedora-ci"
      build_args: |
        INSTALLATION_TYPE=${{ matrix.build-type }}
        FEDORA_VERSION=${{ matrix.fedora }}
      post_build_script: |
          BUILD_TYPE="${{ matrix.build-type }}"
          FEDORA="${{ matrix.fedora }}"
          tag_suffix=""
          if [ "$BUILD_TYPE" = "native" ]; then
              echo "install_type=native" >> "$GITHUB_OUTPUT"
          elif [ "$BUILD_TYPE" = "rustup" ]; then
              tag_suffix="rustup-"
              install_type="rustup"
          else
              echo "::warn ::Invalid BUILD_TYPE=$BUILD_TYPE"
              exit 1
          fi

          echo "- Fedora: '$FEDORA'" >> $GITHUB_STEP_SUMMARY
          RUST_VERSION=$(podman run --rm localhost/${{ github.event.repository.name }} rustc --version | cut -d" " -f2)
          echo "- Rustc version: $RUST_VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- Type: ${{ matrix.build-type }}" >> $GITHUB_STEP_SUMMARY
          RUST_SHORT_VERSION=$(echo "$RUST_VERSION" | cut -d"." -f 1,2)
          CARGO_VERSION=$(podman run --rm localhost/${{ github.event.repository.name }} cargo auditable --version | cut -d" " -f2)
          echo "- cargo-auditable: $CARGO_VERSION" >> $GITHUB_STEP_SUMMARY

          if [ "$FEDORA" = "45" ]; then
            echo "tags=${tag_suffix}latest ${RUST_VERSION}-${tag_suffix}fedora$FEDORA ${RUST_SHORT_VERSION}-${tag_suffix}fedora$FEDORA ${tag_suffix}fedora$FEDORA" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${RUST_VERSION}-${tag_suffix}fedora$FEDORA ${RUST_SHORT_VERSION}-${tag_suffix}fedora$FEDORA ${tag_suffix}fedora$FEDORA" >> "$GITHUB_OUTPUT"
          fi
